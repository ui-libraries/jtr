<p>On the twenty second day of September Anno Domini<br>
1809 Mary Calhoun of the township of Aston makes<br>
return on oath of a female Negro Child named<br>
Margaret Reddon born the fifth day of April<br>
last in order that the said child may be entered<br>
&amp; Registered According to law</p>
<p><i>Jos: Engle Clk</i></p>
